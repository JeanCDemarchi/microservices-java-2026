spring.application.name=config-service
server.port=8888

spring.cloud.config.server.git.uri=https://github.com/JeanCDemarchi/microservices-java-2026
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.search-paths=configs

eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,circuit-breakers,circuit-breaker-events
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true

info.app.name=${spring.application.name}
info.app.description=Microserviço responsável por centralizar as configurações dos microsserviços
info.app.autor=Jean Carlos Demarchi

eureka.instance.metadata-map.github.repo=JeanCDemarchi/microservices-java-2026